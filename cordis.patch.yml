# 北极星 (Polaris) atomic primitive bundle layer.
#
# Each row is an independent, stateless, single-responsibility primitive.
# Users can disable any row by id in their profile cordis.patch.yml without
# affecting the others:
#
#   - id: polaris-exec
#     disabled: true
#
# All primitives ship as plain ESM with zero dependencies and no build step.
- insert:
    - id: polaris-discovery
      name: dsh-polaris/discovery

    - id: polaris-audit
      name: dsh-polaris/audit

    - id: polaris-exec
      name: dsh-polaris/exec

    - id: polaris-verify
      name: dsh-polaris/verify

    - id: polaris-retrieve
      name: dsh-polaris/retrieve

    - id: polaris-license
      name: dsh-polaris/license

    - id: polaris-rules
      name: dsh-polaris/rules
