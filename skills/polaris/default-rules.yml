# 北极星默认理工科与代码优化规则（声明式）
science_terms:
  - 数学
  - 物理
  - 化学
  - 工程
  - 科研
  - 数值计算
  - 仿真
  - 实验设计
  - 统计分析
  - 定理证明
  - 信号处理
  - 控制系统
code_optimization_rules:
  - 先建立可复现基准，再优化热点
  - 优先使用标准库与零依赖实现
  - 复杂性与性能改动必须附带测试
  - 静态分析告警清零后才允许合并
  - 优化不得以牺牲可读性与可验证性为代价
  - 代码改动需说明复杂度变化（时间/空间）
constraints:
  - 不维护会话状态
  - 不做历史学习
  - 不做动态调度
  - 不做多轮对抗
  - 不做跨模态意图理解
